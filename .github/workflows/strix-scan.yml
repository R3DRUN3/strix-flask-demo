
name: Strix Security Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strix-scan:
    name: AI Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Install Strix CLI
      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash

      # 3. Verify Strix installation
      - name: Verify Strix installation
        run: |
          strix --help

      # 4. Pre-pull Strix sandbox image
      - name: Pre-pull Strix sandbox image
        run: |
          docker pull ghcr.io/usestrix/strix-sandbox:1.4.0

      # 5. Run Strix security scan
      - name: Run Strix security scan
        env:
          STRIX_IMAGE: ghcr.io/usestrix/strix-sandbox:1.4.0

          # Azure AI Foundry configuration
          STRIX_LLM: openai/${{ secrets.AZURE_FOUNDRY_DEPLOYMENT }}
          LLM_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          LLM_API_BASE: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}

        run: |
          strix -n --target ./ --scan-mode quick

      # 6. Upload scan reports
      - name: Upload Strix reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 14
