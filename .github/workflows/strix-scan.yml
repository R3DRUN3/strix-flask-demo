
name: Strix Security Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strix-scan:
    name: AI Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash

      - name: Verify Strix installation
        run: |
          strix --help

      # Discover the sandbox image already pulled by Strix
      - name: Detect Strix sandbox image
        id: sandbox
        shell: bash
        run: |
          IMAGE=$(docker images \
            --format '{{.Repository}}:{{.Tag}}' \
            | grep '^ghcr.io/usestrix/strix-sandbox:' \
            | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Strix sandbox image not found!"
            docker images
            exit 1
          fi

          echo "Detected Strix sandbox image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run Strix security scan
        env:
          STRIX_IMAGE: ${{ steps.sandbox.outputs.image }}

          STRIX_LLM: openai/${{ secrets.AZURE_FOUNDRY_DEPLOYMENT }}
          LLM_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          LLM_API_BASE: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}

        run: |
          echo "Using sandbox image: $STRIX_IMAGE"
          strix -n --target ./ --scan-mode quick

      - name: Upload Strix reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 14
